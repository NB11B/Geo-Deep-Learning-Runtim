[build-system]
requires = ["setuptools>=75", "wheel", "torch>=2.6", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-deep-learning-runtime"
version = "0.1.0"
description = "Tensor and autograd runtime backed by Geometric Elementary Operators"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "native: requires the compiled GEO extension",
  "cuda: requires a CUDA-capable GEO extension and GPU",
]
